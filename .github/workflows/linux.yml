# Compile the Vulkan runtime on Linux before and during the N4 backend migration.
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build
        run: nix-shell shell.nix --run 'bash build.sh'
      - name: Test resource storage, upload baselines and trophy notices
        run: |
          nix-shell shell.nix --run 'set -e
          ninja -C out/gpu slot-vector-test image-upload-hash-test trophy-queue-test
          out/gpu/slot-vector-test
          out/gpu/image-upload-hash-test
          out/gpu/trophy-queue-test'

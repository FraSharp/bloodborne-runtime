# Builds the runtime (bb-probe, the GPU library, bbcpu from the recomp submodule) on Apple Silicon:
# every push to main and every pull request. The app and its releases: bloodborne-mac.
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15 # Apple Silicon
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The newest Xcode on the image: the GPU library uses std::jthread and std::stop_token,
      # which Xcode 16's libc++ keeps behind -fexperimental-library.
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          clang --version | head -1

      - name: Tools
        run: brew install bash pkgconf glslang nasm cmake ninja spirv-tools clang-format

      # FSR 4.1.1 on Metal: its kernels need Xcode's Metal Toolchain, a separate component. The
      # build skips them, with a warning, when the download fails.
      - name: Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal Toolchain unavailable"

      # The archives the dependency build downloads (deps/packages.cmake): with them a fresh
      # deps/macos-arm64 takes about five minutes instead of an hour.
      - name: Dependency archives
        uses: actions/cache@v4
        with:
          path: build/deps-arm64/download
          key: deps-download-${{ hashFiles('deps/packages.cmake') }}

      - name: Build and test
        run: BB_ARCH=arm64 bash build.sh --test
